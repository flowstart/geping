---
layout: default
---
<section class="intro">
  <p>{{ site.description }}</p>
</section>
<ul class="posts">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="date">{{ post.date | date: '%Y-%m-%d' }}</span>
    {% if post.summary %}<p>{{ post.summary }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
